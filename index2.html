<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan IFrame</title>
</head>

<body>

    <h2>1. IFrame Website UDINUS</h2>

    <iframe 
        src="https://alumni-v2.dinus.ac.id/akreditasi/"
        width="600"
        height="300">
    </iframe>

    <h2>2. IFrame File HTML Sendiri</h2>

    <iframe 
        src="list.html"
        width="600"
        height="300">
      </iframe>


    <h2>3. IFrame Video YouTube</h2>

    <iframe 
        width="560"
        height="315"
        src="https://www.youtube.com/embed/H4mRMXrEf4c?si=8fkHnLU8lfXW7x9H"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
    </iframe>

</body>

</html>
